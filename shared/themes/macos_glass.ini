[General]
; macOS-style glass theme for Windows 11 (Mica backdrop)
; Background is fully transparent so Win11 Mica effect shows through.

notes_css=
find_bg=#2060a0
bg=rgba(0,0,0,0)
edit_font="Sans,11,-1,5,50,0,0,0,0,0"
find_font="Sans,10,-1,5,50,0,0,0,0,0"
alt_item_css=
sel_fg=#ffffff
show_scrollbars=false
find_fg=#ffffff
edit_bg=#2a2a2e
num_fg=rgba(200,200,200,120)
font="Sans,10,-1,5,50,0,0,0,0,0"
sel_item_css=
sel_bg=rgba(80,130,220,180)
notes_font="Sans,11,-1,5,50,0,0,0,0,0"
edit_fg=#e8e8e8
show_number=true
notes_fg=#e0e0e0
item_css=
alt_bg=rgba(0,0,0,0)
css=
fg=rgba(240,240,245,255)
num_font="Sans,7,-1,5,25,0,0,0,0,0"
notes_bg=#2a2a2e

; Search bar: subtle glass pill
search_bar=color: rgba(240,240,245,220); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.20); selection-background-color: rgba(80,130,220,180); selection-color: #fff;
search_bar_focused=color: rgba(240,240,245,255); background: rgba(255,255,255,0.17); border: 1px solid rgba(120,170,255,0.55);

; Tab bar
tab_bar_css=color: rgba(240,240,245,200); background: rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.10);
tab_bar_tab_selected_css=color: rgba(240,240,245,255); background: rgba(255,255,255,0.18); border-bottom: 2px solid rgba(120,170,255,0.80);
tab_bar_tab_unselected_css=color: rgba(200,200,210,160); background: transparent;
tab_bar_item_counter=color: rgba(150,180,255,200); background: transparent;
tab_bar_sel_item_counter=color: rgba(150,180,255,255); background: transparent;
tab_bar_scroll_buttons_css=color: rgba(200,200,210,160); background: transparent; border: none;

; Tab tree
tab_tree_css=color: rgba(220,220,230,200); background: rgba(255,255,255,0.06); border: none;
tab_tree_sel_item_css=color: rgba(240,240,245,255); background: rgba(80,130,220,0.35);
tab_tree_item_counter=color: rgba(150,180,255,180); background: transparent;
tab_tree_sel_item_counter=color: rgba(150,180,255,230); background: transparent;

; Toolbar
tool_bar_css=background: rgba(255,255,255,0.06); border: none; spacing: 2px;
tool_button_css=color: rgba(220,220,230,200); background: transparent; border: none; border-radius: 6px; padding: 4px;
tool_button_selected_css=color: rgba(240,240,245,255); background: rgba(255,255,255,0.15); border-radius: 6px;
tool_button_pressed_css=color: rgba(240,240,245,255); background: rgba(255,255,255,0.10); border-radius: 6px;

; Item hover/current highlight (used for #item widget via hover_item_css/cur_item_css)
hover_item_css=
cur_item_css=border: 1px solid rgba(120,170,255,0.45);
